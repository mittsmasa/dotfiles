[tools]
node = "24.22.1"
pnpm = "12.15.0"
starship = "1.27.0"
"npm:@playwright/cli" = "0.1.22"
"npm:skills" = "1.7.4"
chezmoi = "2.73.3"
gitleaks = "8.30.1"
gh = "2.103.0"
"npm:@github/copilot" = "1.0.102"
just = "1.59.0"
"npm:vercel" = "65.1.0"
uv = "0.13.5"
age = "latest"
"github:jdx/fnox" = "1.42.0"
"github:yusukebe/ax" = { version = "0.1.25", exe = "ax" }

[settings]
idiomatic_version_file_enable_tools = ["node"]
minimum_release_age = "7d"
# mise use を常に exact version で config に書く（--pin のデフォルト化）
pin = true
disable_backends = ["asdf", "cargo", "conda", "dotnet", "forgejo", "gem", "gitlab", "go", "pipx", "spm", "http", "s3", "ubi", "vfox"]

# GitHub API の rate limit 回避。gh の token は keyring にあり hosts.yml を読む gh_cli_tokens では拾えないため、
# 必要時だけ gh から取得する（GITHUB_TOKEN を環境変数に常駐させない）。
# credential_command は shims を PATH に入れずに実行されるため、mise 管理の gh を shim の絶対パスで呼ぶ
[settings.github]
credential_command = '"$HOME/.local/share/mise/shims/gh" auth token --hostname "$MISE_CREDENTIAL_HOST"'
