[tools]
node = "24.20.0"
pnpm = "11.24.0"
starship = "1.26.0"
"npm:@playwright/cli" = "0.1.18"
"npm:skills" = "1.5.23"
chezmoi = "2.72.0"
gitleaks = "8.30.1"
gh = "2.99.0"
bun = "1.4.0"
"npm:@github/copilot" = "1.0.81"
just = "1.58.0"
"npm:vercel" = "59.7.0"
uv = "0.12.7"
age = "latest"
"github:jdx/fnox" = "1.34.1"
ffmpeg = "8.1.2"
"github:yusukebe/ax" = { version = "0.1.25", exe = "ax" }

[settings]
idiomatic_version_file_enable_tools = ["node"]
minimum_release_age = "7d"
# mise use を常に exact version で config に書く（--pin のデフォルト化）
pin = true
disable_backends = ["asdf", "cargo", "conda", "dotnet", "forgejo", "gem", "gitlab", "go", "pipx", "spm", "http", "s3", "ubi", "vfox"]
