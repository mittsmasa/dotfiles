[tools]
node = "24.21.0"
pnpm = "12.8.2"
starship = "1.26.0"
"npm:@playwright/cli" = "0.1.22"
"npm:skills" = "1.7.0"
chezmoi = "2.73.0"
gitleaks = "8.30.1"
gh = "2.102.0"
bun = "1.4.2"
"npm:@github/copilot" = "1.0.90"
just = "1.58.0"
"npm:vercel" = "61.1.0"
uv = "0.12.21"
age = "latest"
"github:jdx/fnox" = "1.36.0"
ffmpeg = "8.1.2"
"github:yusukebe/ax" = { version = "0.1.25", exe = "ax" }

[settings]
idiomatic_version_file_enable_tools = ["node"]
minimum_release_age = "7d"
# mise use を常に exact version で config に書く（--pin のデフォルト化）
pin = true
disable_backends = ["asdf", "cargo", "conda", "dotnet", "forgejo", "gem", "gitlab", "go", "pipx", "spm", "http", "s3", "ubi", "vfox"]
