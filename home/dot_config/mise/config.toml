[tools]
node = "24.22.1"
pnpm = "12.14.0"
starship = "1.26.0"
"npm:@playwright/cli" = "0.1.22"
"npm:skills" = "1.7.2"
chezmoi = "2.73.1"
gitleaks = "8.30.1"
gh = "2.102.0"
"npm:@github/copilot" = "1.0.98"
just = "1.59.0"
"npm:vercel" = "64.2.0"
uv = "0.13.4"
age = "latest"
"github:jdx/fnox" = "1.39.0"
ffmpeg = "8.1.2"
"github:yusukebe/ax" = { version = "0.1.25", exe = "ax" }

[settings]
idiomatic_version_file_enable_tools = ["node"]
minimum_release_age = "7d"
# mise use を常に exact version で config に書く（--pin のデフォルト化）
pin = true
disable_backends = ["asdf", "cargo", "conda", "dotnet", "forgejo", "gem", "gitlab", "go", "pipx", "spm", "http", "s3", "ubi", "vfox"]
